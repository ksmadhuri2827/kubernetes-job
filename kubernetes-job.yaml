apiVersion: batch/v1
kind: Job

metadata:
  name: scientific-compute-job

spec:
  template:
    spec:
      containers:
        - name: scientific-compute
          image: scientific-compute:latest
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"

            limits:
              cpu: "1"
              memory: "1Gi"

      restartPolicy: Never
